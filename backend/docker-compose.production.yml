version: "3.9"

services:

  api:

    build:
      context: ../backend

    env_file:
      - ../backend/.env

    ports:
      - "8000:8000"

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

  postgres:

    image: postgres:17

    restart: unless-stopped

    environment:
      POSTGRES_DB: newslens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:

  postgres_data: