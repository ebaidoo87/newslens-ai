name: NewsLens CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  backend:
    name: Backend Checks

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newslens_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/newslens_test

      SECRET_KEY: ci-test-secret-key

      ENVIRONMENT: development

      DEBUG: "false"

      NEWS_API_KEY: test-key

      NEWS_API_URL: https://newsapi.org/v2

      RESEND_API_KEY: test-key

      RESEND_WEBHOOK_SECRET: test-secret

      EMAIL_FROM: NewsLens AI <test@example.com>

      CORS_ORIGINS: '["http://localhost:5173"]'

      TRUSTED_HOSTS: '["localhost","127.0.0.1"]'

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Compile backend
        run: |
          python -m compileall app

      - name: Run database migrations
        run: alembic upgrade head

      - name: Validate database schema
        run: |
          python - <<'PY'
          from app.db.session import SessionLocal
          from app.services.startup_service import StartupService

          db = SessionLocal()

          try:
              service = StartupService(db)

              service.check_database_connection()
              service.validate_schema()

              print(
                  "Database startup validation passed"
              )

          finally:
              db.close()
          PY


  frontend:
    name: Frontend Build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint


      - name: Build frontend
        run: npm run build


  docker:
    name: Docker Build

    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build backend image
        run: |
          docker build \
            -t newslens-api:test \
            ./backend
            

      